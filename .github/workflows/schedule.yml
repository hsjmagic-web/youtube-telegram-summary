name: Daily YouTube Summary

on:
  schedule:
    # 한국 시간 기준 월~금요일 오전 08:00 실행 (UTC 기준 일~목요일 23:00)
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

jobs:
  run-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: |
          pip install --upgrade feedparser google-genai requests holidays youtube-transcript-api

      - name: 스크립트 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py
